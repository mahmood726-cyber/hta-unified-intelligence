name: HTA Intelligence Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 1' # Weekly

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.3.2

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: apt-get update && apt-get install -y python3 python3-pip

      - name: Install R deps
        run: Rscript setup.R

      - name: Install Python deps
        run: pip3 install -r requirements.txt

      - name: Run R logic tests
        run: Rscript tests/run_tests.R

      - name: Run Python contract tests
        run: pytest tests/test_verification_contract.py -v
        # Allow this to soft-fail when artefacts are absent on a fresh checkout
        continue-on-error: true

  pipeline:
    name: Pipeline (scheduled / main only)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    container: rocker/tidyverse:4.3.2

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: apt-get update && apt-get install -y python3 python3-pip

      - name: Install R deps
        run: Rscript setup.R

      - name: Install Python deps
        run: pip3 install -r requirements.txt

      - name: Run pipeline
        run: |
          Rscript src/R/master_integration_pipeline.R
          Rscript src/R/run_tgep_integration.R || true
          Rscript src/R/master_integration_pipeline.R
          python3 src/python/generate_narratives.py
          python3 src/python/archive_manager.py
          python3 src/python/update_dashboard.py
          python3 src/python/generate_manifest.py

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: hta-dashboard
          path: |
            Unified_HTA_Dashboard.html
            output/
